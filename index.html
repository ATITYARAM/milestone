<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <h1>Milestone Tracker</h1>
        <div id="counter" class="counter">Loading...</div>
    </div>

    <div class="viewport-container" id="viewport">
        <div class="linkedin-post-card" id="post-card">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <!-- Floating Action Button to Add New -->
    <button class="fab-add" onclick="openModal()" title="Add Milestone">+</button>

    <!-- Modal for Manual Creation -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <h2>Add New Milestone Post</h2>
            <div class="form-group">
                <label>Date / Tag (e.g. June 2026)</label>
                <input type="text" id="inputDate" placeholder="e.g. Jan 2026">
            </div>
            <div class="form-group">
                <label>Milestone Title</label>
                <input type="text" id="inputTitle" placeholder="Project or Hackathon Name">
            </div>
            <div class="form-group">
                <label>Post Content</label>
                <textarea id="inputContent" placeholder="Write what you achieved..."></textarea>
            </div>
            <div class="form-group">
                <label>Image URL or Asset Path (Optional)</label>
                <input type="text" id="inputImage" placeholder="assets/images/my-photo.jpg">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveMilestone()">Save Post</button>
            </div>
        </div>
    </div>

    <div class="nav-instructions">
        Use <kbd>←</kbd> <kbd>→</kbd> arrow keys or swipe left/right on mobile
    </div>

    <script>
        let milestones = [];
        let currentIndex = 0;

        async function loadMilestones() {
            try {
                const response = await fetch('data.json');
                milestones = await response.json();
                renderPost();
            } catch (error) {
                document.getElementById('post-card').innerHTML = `<p style="padding:20px; color:red;">Error loading data.json</p>`;
            }
        }

        function renderPost() {
            if (milestones.length === 0) {
                document.getElementById('counter0') = '';
                document.getElementById('post-card').innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #666;">
                        <p style="font-weight: 600; margin-bottom: 8px;">No milestones stored yet.</p>
                        <p style="font-size: 0.85rem;">Click the <b>+</b> button below to add one!</p>
                    </div>
                `;
                document.getElementById('counter').innerText = '0 milestones';
                return;
            }
            
            const item = milestones[currentIndex];
            const card = document.getElementById('post-card');
            
            document.getElementById('counter').innerText = `Milestone ${currentIndex + 1} of ${milestones.length}`;

            let imageHTML = '';
            if (item.image && item.image.trim() !== '') {
                imageHTML = `
                    <div class="post-media">
                        <img src="${item.image}" alt="Milestone Image" onerror="this.style.display='none'">
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="post-header">
                    <div class="profile-pic">AM</div>
                    <div class="profile-info">
                        <h3>Atitya Ram Suresh Manickam</h3>
                        <p>CSE Student & Developer</p>
                    </div>
                    <span class="post-date-tag">${item.date}</span>
                    <button class="delete-btn" onclick="deleteCurrentMilestone(${currentIndex})" title="Delete Post">🗑️</button>
                </div>
                <div class="post-body">
                    <div class="post-title">${item.title}</div>
                    <div class="post-text">${item.content}</div>
                </div>
                ${imageHTML}
                <div class="post-footer-actions">
                    <span>👍 Like</span>
                    <span>💬 Comment</span>
                    <span>🔄 Repost</span>
                    <span>↗ Share</span>
                </div>
            `;
        }

        function nextSlide() {
            if (milestones.length === 0) return;
            currentIndex = (currentIndex + 1) % milestones.length;
            renderPost();
        }

        function prevSlide() {
            if (milestones.length === 0) return;
            currentIndex = (currentIndex - 1 + milestones.length) % milestones.length;
            renderPost();
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Touch Swipe Logic for Android / Mobile screens
        let touchStartX = 0;
        let touchEndX = 0;

        const viewport = document.getElementById('viewport');

        viewport.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50; // minimum distance for swipe
            if (touchEndX < touchStartX - threshold) {
                // Swiped Left -> Next Post
                nextSlide();
            }
            if (touchEndX > touchStartX + threshold) {
                // Swiped Right -> Previous Post
                prevSlide();
            }
        }

        // Modal Controls
        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('inputDate').value = '';
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputContent').value = '';
            document.getElementById('inputImage').value = '';
        }

        function saveMilestone() {
            const date = document.getElementById('inputDate').value.trim();
            const title = document.getElementById('inputTitle').value.trim();
            const content = document.getElementById('inputContent').value.trim();
            const image = document.getElementById('inputImage').value.trim();

            if (!title || !content) {
                alert('Please fill out at least the title and content.');
                return;
            }

            const newPost = {
                id: Date.now(),
                date: date || 'Recent',
                title: title,
                content: content,
                image: image
            };

            milestones.push(newPost);
            currentIndex = milestones.length - 1; // jump to newly created post
            closeModal();
            renderPost();
            
            // Helpful note for persistence
            alert('Post added locally! To save it permanently into your repo, copy your updated data array into data.json and commit it.');
        }

        function deleteCurrentMilestone(index) {
            if (confirm('Are you sure you want to delete this milestone post?')) {
                milestones.splice(index, 1);
                if (currentIndex >= milestones.length) {
                    currentIndex = Math.max(0, milestones.length - 1);
                }
                renderPost();
            }
        }

        loadMilestones();
    </script>
</body>
</html>
