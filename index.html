<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <h1>Milestone Tracker</h1>
        <div id="counter" class="counter">Loading...</div>
    </div>

    <div class="viewport-container" id="viewport">
        <div class="linkedin-post-card" id="post-card">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- "+" Button placed directly below the viewing post -->
        <button class="fab-add" onclick="openModal()" title="Create a post">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="#ffffff">
                <path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6v-2z"></path>
            </svg>
        </button>

        <div class="nav-instructions">
            Use <kbd>←</kbd> <kbd>→</kbd> arrow keys or swipe left/right on mobile
        </div>
    </div>

    <!-- LinkedIn Style "Create a post" Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="linkedin-create-modal">
            <div class="modal-header">
                <h2>Create a post</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="create-profile-row">
                <div class="profile-pic">AM</div>
                <div class="profile-info-create">
                    <h3>Atitya Ram Suresh Manickam</h3>
                    <div class="visibility-chip">
                        <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.25a5.75 5.75 0 110 11.5A5.75 5.75 0 018 2.25z"></path></svg>
                        Anyone
                    </div>
                </div>
            </div>

            <div class="create-form">
                <input type="text" id="inputTitle" class="invisible-input title-input" placeholder="Give your milestone a title...">
                <textarea id="inputContent" class="invisible-input content-input" placeholder="What do you want to talk about?"></textarea>
                
                <div class="extra-fields">
                    <input type="text" id="inputDate" class="small-input" placeholder="Date (e.g. Aug 2026)">
                    <input type="text" id="inputImage" class="small-input" placeholder="Image URL (Optional)">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-post" onclick="saveMilestone()">Post</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION FOR DIRECT GIT SYNC ---
        const GITHUB_USERNAME = "ATITYARAM";
        const GITHUB_REPO = "milestone";
        const GITHUB_BRANCH = "main";
        const GITHUB_TOKEN = "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";

        let milestones = [];
        let currentIndex = 0;

        async function loadMilestones() {
            try {
                const response = await fetch('data.json');
                milestones = await response.json();
                renderPost();
            } catch (error) {
                document.getElementById('post-card').innerHTML = `<p style="padding:20px; color:red;">Error loading data.json</p>`;
            }
        }

        function renderPost() {
            if (milestones.length === 0) {
                document.getElementById('post-card').innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #666;">
                        <p style="font-weight: 600; margin-bottom: 8px; font-size: 1.1rem;">No milestones yet.</p>
                        <p style="font-size: 0.9rem;">Click the + button below to create a post!</p>
                    </div>
                `;
                document.getElementById('counter').innerText = '0 milestones';
                return;
            }
            
            const item = milestones[currentIndex];
            const card = document.getElementById('post-card');
            
            document.getElementById('counter').innerText = `Milestone ${currentIndex + 1} of ${milestones.length}`;

            let imageHTML = '';
            if (item.image && item.image.trim() !== '') {
                imageHTML = `
                    <div class="post-media">
                        <img src="${item.image}" alt="Milestone Image" onerror="this.style.display='none'">
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="post-header">
                    <div class="profile-pic">AM</div>
                    <div class="profile-info">
                        <h3>Atitya Ram Suresh Manickam</h3>
                        <p>CSE Student & Developer</p>
                    </div>
                    <span class="post-date-tag">${item.date}</span>
                    <button class="delete-btn" onclick="deleteCurrentMilestone(${currentIndex})" title="Delete Post">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/>
                        </svg>
                    </button>
                </div>
                <div class="post-body">
                    <div class="post-title">${item.title}</div>
                    <div class="post-text">${item.content}</div>
                </div>
                ${imageHTML}
                <div class="post-footer-actions">
                    <span>👍 Like</span>
                    <span>💬 Comment</span>
                    <span>🔄 Repost</span>
                    <span>↗ Share</span>
                </div>
            `;
        }

        // --- GitHub API Sync Function ---
        async function updateRemoteDataFile(commitMessage) {
            const apiPath = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/data.json`;
            const headers = {
                "Authorization": `Bearer ${GITHUB_TOKEN}`,
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
            };

            try {
                const getRes = await fetch(apiPath, { headers });
                if (!getRes.ok) throw new Error("Failed to fetch file SHA from GitHub.");
                const fileData = await getRes.json();
                const fileSha = fileData.sha;

                const updatedJsonString = JSON.stringify(milestones, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonString)));

                const putRes = await fetch(apiPath, {
                    method: "PUT",
                    headers: headers,
                    body: JSON.stringify({
                        message: commitMessage,
                        content: encodedContent,
                        sha: fileSha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (!putRes.ok) throw new Error("Failed to commit changes to GitHub.");
                console.log("Successfully updated data.json on GitHub!");
            } catch (err) {
                console.error(err);
                alert("Error syncing with GitHub: " + err.message);
            }
        }

        function nextSlide() {
            if (milestones.length === 0) return;
            currentIndex = (currentIndex + 1) % milestones.length;
            renderPost();
        }

        function prevSlide() {
            if (milestones.length === 0) return;
            currentIndex = (currentIndex - 1 + milestones.length) % milestones.length;
            renderPost();
        }

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('addModal').style.display === 'flex') return;
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        let touchStartX = 0;
        let touchEndX = 0;
        const viewport = document.getElementById('viewport');

        viewport.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50; 
            if (touchEndX < touchStartX - threshold) nextSlide();
            if (touchEndX > touchStartX + threshold) prevSlide();
        }

        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('inputTitle').focus();
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputContent').value = '';
            document.getElementById('inputDate').value = '';
            document.getElementById('inputImage').value = '';
        }

        async function saveMilestone() {
            const title = document.getElementById('inputTitle').value.trim();
            const content = document.getElementById('inputContent').value.trim();
            const date = document.getElementById('inputDate').value.trim();
            const image = document.getElementById('inputImage').value.trim();

            if (!content) {
                alert('Please write something in your post.');
                return;
            }

            const newPost = {
                id: Date.now(),
                date: date || 'Recent',
                title: title,
                content: content,
                image: image
            };

            milestones.push(newPost);
            currentIndex = milestones.length - 1;
            closeModal();
            renderPost();

            await updateRemoteDataFile(`Add milestone: ${title || 'New Post'}`);
        }

        async function deleteCurrentMilestone(index) {
            if (confirm('Delete this post?')) {
                milestones.splice(index, 1);
                if (currentIndex >= milestones.length) {
                    currentIndex = Math.max(0, milestones.length - 1);
                }
                renderPost();

                await updateRemoteDataFile(`Delete milestone at index ${index}`);
            }
        }

        loadMilestones();
    </script>
</body>
</html>
